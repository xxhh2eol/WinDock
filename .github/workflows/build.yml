name: Build & Package

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # 发布自包含版本（无需目标机器安装 .NET）
      # 注意：csproj 相对仓库根为 WinDock/WinDock/WinDock.csproj（两层 WinDock）
      - name: Publish (self-contained win-x64)
        shell: pwsh
        run: dotnet publish "WinDock/WinDock/WinDock.csproj" -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/WinDock.exe")) { Write-Error "publish/WinDock.exe not found"; exit 1 }
          Write-Host "publish output OK: $((Get-ChildItem publish -File | Measure-Object).Count) files"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # 版本号：tag 为 vX.Y.Z 时用 X.Y.Z，否则默认 1.0.0
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+)') { $v = $Matches[1] } else { $v = '1.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "installer/WinDock.iss"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinDock-Setup
          path: installer-output/WinDock-Setup-*.exe
          if-no-files-found: error

      # 打 tag（vX.Y.Z）时自动发布 GitHub Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/WinDock-Setup-*.exe
